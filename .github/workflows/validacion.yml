name: Validación Proyecto - GitHub Hooks y ADR

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validacion:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    # Checkout del código
    - name: Checkout código
      uses: actions/checkout@v4
    
    # Configurar Python
    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Instalar dependencias
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest black isort
    
    # Verificar sintaxis Python
    - name: Verificar sintaxis Python
      run: |
        python -m py_compile app.py
        python -m py_compile check_adr.py
        python -m py_compile check_architecture.py
    
    # Validar formato con Black
    - name: Validar formato con Black
      run: black --check . || true
    
    # Validar imports con isort
    - name: Validar imports con isort
      run: isort --check-only . || true
    
    # Linting con Flake8
    - name: Linting con Flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    # ✅ Validación ADR
    - name: Validar ADRs
      run: python check_adr.py
    
    # ✅ Validación Coherencia Arquitectura-Código
    - name: Validar coherencia arquitectura-código
      run: python check_architecture.py
    
    # Ejecutar pruebas (si existen)
    - name: Ejecutar tests (si existen)
      run: |
        if [ -f pytest.ini ] || [ -d tests ] || ls test_*.py 1> /dev/null 2>&1; then
          pytest -v
        else
          echo "⚠️  No se encontraron tests"
        fi
      continue-on-error: true
    
    # Verificar Procfile para despliegue
    - name: Verificar Procfile
      run: |
        if [ -f Procfile ]; then
          echo "✅ Procfile existe"
          cat Procfile
        else
          echo "❌ ERROR: Procfile no existe"
          exit 1
        fi
    
    # Verificar estructura de directorios ADR
    - name: Verificar estructura ADR
      run: |
        echo "Archivos ADR encontrados:"
        ls -la docs/adr/ || echo "❌ Directorio docs/adr no existe"
    
    # Resumen de validación
    - name: Resumen de validación
      if: always()
      run: |
        echo "=================================================="
        echo "RESUMEN DE VALIDACIÓN DEL PROYECTO"
        echo "=================================================="
        echo "✅ Sintaxis Python: Validado"
        echo "✅ Formato de código: Revisado"
        echo "✅ Imports: Validados"
        echo "✅ ADRs: Validados"
        echo "✅ Coherencia Arquitectura: Validada"
        echo "✅ Procfile: Validado"
        echo "=================================================="
        echo "Estado: LISTO PARA MERGE ✅"
        echo "=================================================="

  # Job adicional para validar antes de merge al main
  validacion-merge:
    runs-on: ubuntu-latest
    needs: validacion
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4
    
    - name: Validar branchs de despliegue
      run: |
        if [[ "${{ github.head_ref }}" == "develop" || "${{ github.head_ref }}" == "main" ]]; then
          echo "✅ PR desde rama válida: ${{ github.head_ref }}"
        else
          echo "ℹ️  PR desde rama feature: ${{ github.head_ref }}"
        fi
    
    - name: Requerir aprobación antes de merge
      run: |
        echo "⚠️  Este PR requiere:"
        echo "  ✅ Validación de tests (automática)"
        echo "  ✅ Validación de ADRs (automática)"
        echo "  ✅ Revisión de código (manual)"
        echo "  ✅ Aprobación de al menos 1 reviewer"
